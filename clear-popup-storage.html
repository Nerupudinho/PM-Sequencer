<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clear Newsletter Popup Storage</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
        }
        h1 {
            color: #333;
            margin-bottom: 1rem;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
            transition: background 0.3s;
        }
        button:hover {
            background: #5568d3;
        }
        .status {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 6px;
            font-weight: 500;
        }
        .success {
            background: #d4edda;
            color: #155724;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Clear Newsletter Popup Storage</h1>
        <p>This will clear the "don't show again" preference for the newsletter popup.</p>
        <button onclick="clearStorage()">Clear Storage</button>
        <button onclick="checkStorage()">Check Status</button>
        <div id="status"></div>
    </div>

    <script>
        function clearStorage() {
            try {
                localStorage.removeItem('newsletter-popup-dismissed');
                showStatus('Storage cleared successfully! The popup will show again on your site.', 'success');
            } catch (error) {
                showStatus('Error clearing storage: ' + error.message, 'error');
            }
        }

        function checkStorage() {
            try {
                const value = localStorage.getItem('newsletter-popup-dismissed');
                if (value === 'true') {
                    showStatus('Popup is currently dismissed. Click "Clear Storage" to reset.', 'info');
                } else {
                    showStatus('Popup is not dismissed. It should show normally.', 'success');
                }
            } catch (error) {
                showStatus('Error checking storage: ' + error.message, 'error');
            }
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = 'status ' + type;
        }

        // Check status on load
        window.onload = checkStorage;
    </script>
</body>
</html>
